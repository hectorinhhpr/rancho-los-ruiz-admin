<aside [class.w-64]="!colapsado" [class.w-20]="colapsado" class="bg-stone-900 text-stone-300 min-h-screen flex flex-col shadow-2xl transition-all duration-300 relative">
  
  <!-- Botón Hamburguesa Flotante -->
  <button (click)="toggleMenu()" class="absolute -right-4 top-6 bg-green-700 hover:bg-green-600 text-white w-8 h-8 rounded-full shadow-lg z-50 flex items-center justify-center transition">
    ☰
  </button>

  <!-- Logo -->
  <div class="p-6 border-b border-stone-700 overflow-hidden whitespace-nowrap">
    @if (!colapsado) {
      <h2 class="text-2xl font-bold text-white tracking-wider">Los Ruiz</h2>
      <p class="text-xs text-stone-400 mt-1">Panel Administrativo</p>
    } @else {
      <h2 class="text-xl font-bold text-white text-center">LR</h2>
    }
  </div>

  <!-- Navegación -->
  <nav class="flex-1 px-3 py-6 space-y-2 overflow-hidden">
    <a routerLink="/dashboard" routerLinkActive="bg-green-700 text-white shadow-md" class="flex items-center gap-3 px-3 py-3 hover:bg-stone-800 hover:text-white rounded-lg transition cursor-pointer whitespace-nowrap">
      <span class="text-xl">📊</span>
      @if (!colapsado) { <span class="font-medium">Dashboard</span> }
    </a>

    <a routerLink="/pos" routerLinkActive="bg-green-700 text-white shadow-md" class="flex items-center gap-3 px-3 py-3 hover:bg-stone-800 hover:text-white rounded-lg transition cursor-pointer whitespace-nowrap">
      <span class="text-xl">🛒</span>
      @if (!colapsado) { <span class="font-medium">Punto de Venta</span> }
    </a>
    
    <a routerLink="/clientes" routerLinkActive="bg-green-700 text-white shadow-md" class="flex items-center gap-3 px-3 py-3 hover:bg-stone-800 hover:text-white rounded-lg transition cursor-pointer whitespace-nowrap">
      <span class="text-xl">👥</span>
      @if (!colapsado) { <span class="font-medium">Clientes</span> }
    </a>
  </nav>
</aside>
