<div class="min-h-screen flex items-center justify-center bg-stone-100">
  <!-- Contenedor de la tarjeta de login -->
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    
    <!-- Encabezado / Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-stone-800 tracking-tight">Rancho los Ruiz</h1>
      <p class="text-sm text-stone-500 mt-2">Sistema de Administración</p>
    </div>

    <!-- Formulario -->
    <form>
      <!-- Campo Correo -->
      <div class="mb-5">
        <label for="email" class="block text-sm font-semibold text-stone-700 mb-2">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          placeholder="admin@rancholosruiz.com"
          class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition"
        >
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-semibold text-stone-700 mb-2">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          placeholder="••••••••"
          class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition"
        >
      </div>

      <!-- Botón de Acceso -->
      <button 
        type="button" 
        class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition duration-200 ease-in-out transform hover:-translate-y-0.5"
      >
        Iniciar Sesión
      </button>
    </form>

    <!-- Pie de nota -->
    <div class="mt-6 text-center">
      <p class="text-xs text-stone-400">Uso exclusivo del personal autorizado</p>
    </div>

  </div>
</div>
