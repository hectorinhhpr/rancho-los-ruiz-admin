<div class="min-h-screen flex items-center justify-center bg-stone-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <!-- Encabezado / Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-stone-800 tracking-tight">Rancho los Ruiz</h1>
      <p class="text-sm text-stone-500 mt-2">Sistema de Administración</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onLogin()">
      <!-- Campo Correo -->
      <div class="mb-5">
        <label for="email" class="block text-sm font-semibold text-stone-700 mb-2">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@rancholosruiz.com"
          class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
          required
        />
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-semibold text-stone-700 mb-2">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
          required
        />
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMessage" class="mb-4 text-sm text-red-600 font-semibold text-center">
        {{ errorMessage }}
      </div>

      <!-- Botón de Acceso -->
      <button
        type="submit"
        class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 px-4 rounded-lg transition-colors"
      >
        Iniciar Sesión
      </button>
    </form>

  </div>
</div>
